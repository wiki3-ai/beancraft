name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: License check (allow-list, no GPL-2.0-only; bundled packages listed in THIRD_PARTY_NOTICES.md)
        run: npm run check:licenses
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests (fail on any off-origin network request)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
